# Generated by scripts/saas/generate_dependabot.py
# Policy source: config/dependabot.json
version: 2
updates:
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    groups:
      npm-production:
        dependency-type: production
        update-types: ["patch", "minor"]
      npm-development:
        dependency-type: development
        update-types: ["patch", "minor"]
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: scope
    labels:
      - dependencies
      - dependabot

  - package-ecosystem: pip
    directory: "/backend"
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/New_York
    groups:
      pip-patch-minor:
        patterns: ["*"]
        update-types: ["patch", "minor"]
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: scope
    labels:
      - dependencies
      - dependabot

  - package-ecosystem: docker
    directory: "/backend"
    schedule:
      interval: weekly
      day: tuesday
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: scope
    labels:
      - dependencies
      - dependabot

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: scope
    labels:
      - dependencies
      - dependabot
