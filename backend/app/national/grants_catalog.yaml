# WW360 Grants Studio catalog — verified water/wastewater funding programs.
# Eligibility rules are keyed to WW360 district facts (see grants/matcher.py).
# Refresh via Mission Control skills/grants-research when deadlines change.

version: 1
updated: "2026-09-20"
programs:
  - id: epa-iwiwd-2026
    name: Innovative Water Infrastructure Workforce Development Grant
    short_name: EPA IWIWD
    funder: U.S. Environmental Protection Agency
    level: federal
    water_focus: both
    opportunity_number: EPA-OW-OWM-26-03
    status: open
    applicant_types: [nonprofit, higher_ed, labor_org, public_works]
    award_min_usd: 250000
    award_max_usd: 7800000
    total_funding_usd: 10800000
    deadline: "2026-10-05"
    cycle_note: "NOFO posted Aug 19, 2026; due Oct 5, 2026 11:59pm ET"
    portal_url: "https://grants.gov/search-results-detail/363657"
    info_url: "https://www.epa.gov/sustainable-water-infrastructure/innovative-water-infrastructure-workforce-development-program"
    program_areas:
      - id: area_1
        name: Targeted internship / apprenticeship / pre-apprenticeship
        award_range: "$1M–$7.8M"
      - id: area_2
        name: Education programs for elementary, secondary, and higher-ed students
        award_range: "$250K–$1M"
      - id: area_3
        name: Regional workforce collaborations (small/rural / high retirement share)
        award_range: "$250K–$1M"
      - id: area_4
        name: Decentralized water worker training (wells / septic)
        award_range: "$250K–$1M"
    application_components:
      - SF-424 Application for Federal Assistance
      - SF-424A Budget Information
      - Project Narrative (max 20 pages) — Cover, Executive Summary, Project Description, Environmental Results, Programmatic Capability, Budget Narrative
      - Letters of commitment from partner utilities / training providers
      - SAM.gov registration
    eligibility_rules:
      - { fact: applicant_nonprofit_or_edu, op: eq, value: true, weight: 3, reason: "Eligible applicant type (nonprofit, higher-ed, labor, or public works)" }
      - { fact: retirement_share_pct, op: gte, value: 15, weight: 2, reason: "Area 3 fit — elevated retirement-eligible share" }
      - { fact: vacant_critical_positions, op: gte, value: 1, weight: 1, reason: "Documented critical vacancies strengthen need narrative" }
      - { fact: small_rural_system_count, op: gte, value: 5, weight: 1, reason: "Small/rural utility partners available for Area 3" }
    readiness_checklist:
      - { id: sam_gov, label: "SAM.gov registration active", required: true }
      - { id: grants_gov, label: "Grants.gov workspace / authorized organization representative", required: true }
      - { id: sf424, label: "SF-424 and SF-424A drafted", required: true }
      - { id: narrative, label: "20-page project narrative (NOFO §4.B)", required: true }
      - { id: letters, label: "Partner commitment letters", required: true }
      - { id: budget, label: "Budget narrative tied to SF-424A", required: true }
    nofo_outline:
      - { section: "1. Cover Page", hint: "Project title, Area 1–4, applicant, partners, requested amount" }
      - { section: "2. Executive Summary", hint: "≤1 page — need, approach, outputs/outcomes" }
      - { section: "3. Project Description", hint: "Activities, partners, recruitment, training delivery, equity" }
      - { section: "4. Environmental Results", hint: "Outputs and outcomes linked to EPA Pillar 1" }
      - { section: "5. Programmatic Capability / Past Performance", hint: "OWW track record, staff, fiscal controls" }
      - { section: "6. Budget Narrative", hint: "Personnel, fringe, travel, contracts, other — align to SF-424A" }

  - id: ny-wiia-dw
    name: NYS Water Infrastructure Improvement Act — Drinking Water
    short_name: WIIA DW
    funder: NYS Environmental Facilities Corporation
    level: state
    water_focus: drinking_water
    status: closed
    applicant_types: [municipality, public_authority, tribal]
    award_max_usd: 5000000
    award_share_pct: 70
    deadline: "2026-07-27"
    cycle_note: "2026 round closed Jul 27; next round expected ~spring 2027. Pairable with DWSRF."
    portal_url: "https://efc.ny.gov/wiia"
    info_url: "https://efc.ny.gov/wiia"
    application_components:
      - WIIA/IMG web application (grant-only or combined with SRF)
      - Engineering report
      - SEQR / SHPO (not required for pure LSL scope)
      - Smart Growth form
      - MWBE / EEO documentation
    eligibility_rules:
      - { fact: is_ny_municipality, op: eq, value: true, weight: 3, reason: "NY municipality / eligible public entity" }
      - { fact: has_dw_project_need, op: eq, value: true, weight: 2, reason: "Documented drinking-water infrastructure need" }
      - { fact: dac_status, op: eq, value: true, weight: 1, reason: "Disadvantaged Community status strengthens award priority" }
      - { fact: emerging_contaminant_exceedance, op: eq, value: true, weight: 2, reason: "EC above MCL may unlock enhanced WIIA share (70%, uncapped)" }
      - { fact: lsl_inventory_needed, op: eq, value: true, weight: 1, reason: "Lead service line inventory/replacement eligible under WIIA LSL track" }
    readiness_checklist:
      - { id: eng_report, label: "Engineering report complete", required: true }
      - { id: seqr, label: "SEQR / SHPO (if applicable)", required: false }
      - { id: smart_growth, label: "Smart Growth assessment", required: true }
      - { id: mwbe, label: "MWBE / EEO plan", required: true }
      - { id: hardship, label: "Hardship / income survey (if seeking enhanced share)", required: false }

