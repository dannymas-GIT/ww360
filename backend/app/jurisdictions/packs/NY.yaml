exec_tour:
  intro: >-
    This is the executive view of the whole pipeline — from a student discovering
    water careers on onewaterworkforce.org, through Learning Stream training, to a
    hire at a New York utility — plus the statewide EPA compliance landscape. Four
    sources feed it; you read one screen.
  sources: >-
    EPA SDWIS / ECHO is the live federal inventory of New York community water
    systems — compliance, population served, and county pressure. Learning Stream
    is the LMS system of record for training. onewaterworkforce.org captures members
    and the career pipeline. Water Workforce 360 adds the employer side — vacancies,
    retirements, and training needs from utilities.
  sdwis: >-
    Safe Drinking Water Information System (SDWIS) is EPA's national database of
    public water systems. Here you see New York's community water systems: how many
    are active, who they serve, health-based violations, and serious non-compliance
    — the compliance backdrop for workforce planning.
