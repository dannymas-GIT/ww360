services:
  db:
    image: postgres:15
    container_name: ww360_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ww360}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ww360}
    volumes:
      - ww360_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ww360} -d ${POSTGRES_DB:-ww360}"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ww360_network
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: ww360_backend
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ww360}
      POSTGRES_USER: ${POSTGRES_USER:-ww360}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      APP_DOMAIN: ${APP_DOMAIN:-ww360.aquasafe-solutions.us}
      # Allow container-DNS Host header from OWW on shared saas_integration network
      EXTRA_TRUSTED_HOSTS: ${EXTRA_TRUSTED_HOSTS:-ww360_backend}
      AQUASAFE_INTEGRATION_BASE_URL: ${AQUASAFE_INTEGRATION_BASE_URL}
      WW360_SERVICE_TOKEN: ${WW360_SERVICE_TOKEN}
      WW360_SYNC_HMAC_SECRET: ${WW360_SYNC_HMAC_SECRET}
      OWW_SERVICE_TOKEN: ${OWW_SERVICE_TOKEN:-}
      # Co-hosted OWW: use shared saas_integration DNS (ports are 127.0.0.1-only on host)
      OWW_ENTITLEMENT_BASE_URL: ${OWW_ENTITLEMENT_BASE_URL:-http://oww_backend:8000}
      OWW_API_KEY: ${OWW_API_KEY:-}
      OWW_HMAC_SECRET: ${OWW_HMAC_SECRET:-}
      OWW_HANDOFF_CODE_TTL_SECONDS: ${OWW_HANDOFF_CODE_TTL_SECONDS:-90}
      OWW_ENTITLEMENT_CACHE_SECONDS: ${OWW_ENTITLEMENT_CACHE_SECONDS:-1800}
      WW360_PUBLIC_APP_URL: ${WW360_PUBLIC_APP_URL:-https://ww360.aquasafe-solutions.us}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      WW360_ACCESS_REQUEST_TO: ${WW360_ACCESS_REQUEST_TO:-}
      DOC_STUDIO_MS_CLIENT_ID: ${DOC_STUDIO_MS_CLIENT_ID:-}
      DOC_STUDIO_MS_CLIENT_SECRET: ${DOC_STUDIO_MS_CLIENT_SECRET:-}
      DOC_STUDIO_MS_TENANT_ID: ${DOC_STUDIO_MS_TENANT_ID:-common}
      DOC_STUDIO_GOOGLE_CLIENT_ID: ${DOC_STUDIO_GOOGLE_CLIENT_ID:-}
      DOC_STUDIO_GOOGLE_CLIENT_SECRET: ${DOC_STUDIO_GOOGLE_CLIENT_SECRET:-}
      DOC_STUDIO_DROPBOX_APP_KEY: ${DOC_STUDIO_DROPBOX_APP_KEY:-}
      DOC_STUDIO_DROPBOX_APP_SECRET: ${DOC_STUDIO_DROPBOX_APP_SECRET:-}
      DOC_STUDIO_OAUTH_REDIRECT_URI: ${DOC_STUDIO_OAUTH_REDIRECT_URI:-}
      AUTH_SSO_REDIRECT_URI: ${AUTH_SSO_REDIRECT_URI:-}
      USAJOBS_API_KEY: ${USAJOBS_API_KEY:-}
      USAJOBS_USER_AGENT: ${USAJOBS_USER_AGENT:-}
      WW360_SDWIS_STATES: ${WW360_SDWIS_STATES:-NY}
      BLS_API_KEY: ${BLS_API_KEY:-}
    ports:
      - "127.0.0.1:8002:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ww360_network
      - saas_integration
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: ww360_frontend
    ports:
      - "127.0.0.1:8082:80"
    depends_on:
      - backend
    networks:
      - ww360_network
    restart: unless-stopped

volumes:
  ww360_postgres_data:

networks:
  ww360_network:
    driver: bridge
  # Shared with OWW on the same VM for entitlement/handoff (docker network create saas_integration)
  saas_integration:
    external: true
    name: saas_integration
